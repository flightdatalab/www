- id: "flight-data-analysis"
  title: "Flight Data Analysis"
  focus: "Processing and interpreting UAV flight logs"
  description: "Parse multi-rate binary and text flight logs from ArduPilot, PX4, and INAV into structured time-series tables for post-flight diagnostics and mission review."
  metric: "Multi-Format Log Ingestion"
  icon: "activity"

- id: "telemetry-intelligence"
  title: "Telemetry Intelligence"
  focus: "Identifying patterns, anomalies, and unusual flight behaviour"
  description: "Automated statistical and ML-assisted anomaly detection across high-frequency IMU streams, EKF innovation residuals, GPS drift, and actuator saturation."
  metric: "Automated Anomaly Scoring"
  icon: "radar"

- id: "battery-analytics"
  title: "Battery Analytics"
  focus: "Estimating battery performance, endurance, and remaining flight time"
  description: "Model LiPo and Li-ion discharge curves under real load profiles to forecast state-of-health, voltage sag thresholds, and remaining endurance."
  metric: "Endurance & Sag Modeling"
  icon: "battery"

- id: "data-engineering"
  title: "Data Engineering"
  focus: "Normalizing flight data into reusable formats"
  description: "Standardize heterogeneous sensor topics into aligned Apache Parquet, SQLite, and Arrow schemas ready for reproducible research pipelines."
  metric: "Unified Telemetry Schemas"
  icon: "database"

- id: "open-source-tools"
  title: "Open-Source Tools"
  focus: "Building accessible software and libraries for UAV developers and researchers"
  description: "Modular, permissively licensed Python and CLI utilities engineered for rapid integration into academic labs, fleet pipelines, and developer workflows."
  metric: "MIT / Apache-2.0 Ecosystem"
  icon: "code"
