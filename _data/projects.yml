- slug: "uav-flight-analysis"
  name: "UAV Flight Analysis"
  repo: "flightdatalab/uav-flight-analysis"
  status: "Active"
  version: "v0.4.2"
  language: "Python"
  license: "MIT"
  summary: "General-purpose flight-data analysis toolkit for parsing, resampling, and visualizing unmanned aerial vehicle telemetry logs."
  highlights:
    - "Unified parser adapters for ArduPilot (.bin), PX4 (.ulg), and INAV blackbox logs"
    - "Time-aligned multi-rate sensor resampling and attitude/altitude trajectory plots"
    - "Exportable summary metrics for vibration RMS, climb rate, and mission efficiency"
  install_cmd: "pip install uav-flight-analysis"

- slug: "flight-log-anomaly-detector"
  name: "Flight Log Anomaly Detector"
  repo: "flightdatalab/flight-log-anomaly-detector"
  status: "Active"
  version: "v0.3.0"
  language: "Python"
  license: "MIT"
  summary: "Identifies unusual telemetry events, including battery voltage spikes, GPS drift, and IMU outliers."
  highlights:
    - "Rolling z-score and isolation-based detection on accelerometer and gyro axes"
    - "Sudden battery voltage sag/spike flagging and cell imbalance heuristics"
    - "GPS HDOP/satellite drop and positional drift segmentation with JSON/CSV reports"
  install_cmd: "pip install flight-log-anomaly-detector"

- slug: "battery-life-estimator"
  name: "Battery Life Estimator"
  repo: "flightdatalab/battery-life-estimator"
  status: "Active"
  version: "v0.2.1"
  language: "Python"
  license: "Apache-2.0"
  summary: "Predicts total and remaining flight time using historical flight data, current draw profiles, and pack degradation curves."
  highlights:
    - "Empirical Peukert-adjusted discharge modeling calibrated on historical flight logs"
    - "Real-time remaining endurance estimation under varying payload and wind loads"
    - "Pack cycle degradation tracking across multi-flight battery fleets"
  install_cmd: "pip install battery-life-estimator"
