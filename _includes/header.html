<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Flight Data Lab Home">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Flight Data Lab Logo" class="brand-logo" width="38" height="38">
      <div class="brand-text">
        <span class="brand-name">Flight Data Lab</span>
        <span class="brand-sub">flightdatalab.com</span>
      </div>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" id="siteNav" aria-label="Primary Navigation">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
        </li>
        {% endfor %}
        <li>
          <a href="{{ site.github_org }}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">

            GitHub

        </li>
      </ul>
    </nav>
  </div>
</header>
